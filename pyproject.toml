[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-legends-ransomware-early-warning-ai"
version = "0.1.0"
description = "Telemetry correlation and bounded generative AI triage reference lab"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
cl-ransomware-ai = "ransomware_guard.__main__:main"

[tool.setuptools]
packages = ["ransomware_guard"]
